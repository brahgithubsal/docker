# docker-compose.yml — Stack complète Flask + PostgreSQL + Redis
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-flask-api
    ports:
      - '5000:5000'
    environment:
      - FLASK_ENV=production
      - DB_HOST=postgres-db
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

  postgres-db:
    image: postgres:16-alpine
    container_name: devops-postgres
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: SecretPassword2026
      POSTGRES_DB: devops_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devops -d devops_db']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  redis-cache:
    image: redis:7-alpine
    container_name: devops-redis
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
